name: Future Health CI / CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Monorepo Typecheck
        run: pnpm typecheck

  test-node:
    name: Node & TypeScript Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Run Domain & Security Tests
        run: |
          pnpm --filter @future-health/domain test
          pnpm --filter @future-health/auth test
          pnpm --filter @future-health/supabase-adapter test
          pnpm --filter @future-health/device-adapters test
          pnpm --filter @future-health/fhir test
          pnpm --filter @future-health/fhir-gateway test

  test-ai-engine:
    name: Python AI Microservice Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Engine Dependencies
        run: |
          cd services/ai-engine
          pip install -r requirements.txt

      - name: Run Pytest Suite
        run: |
          cd services/ai-engine
          PYTHONPATH=. pytest tests -v

  build-web:
    name: Next.js 15 Web Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.6.0

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Build Web Application
        run: pnpm --filter future-health-web build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_SUPABASE_URL: https://dummy-project.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.dummy

